<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muse Made — Balloon Letter Factory</title>
  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; display: flex; height: 100vh; background: #121216; color: #f0f0f5; overflow: hidden; }
    #sidebar {
      width: 380px; padding: 20px; background: #1c1c24; border-right: 1px solid #2e2e3a;
      display: flex; flex-direction: column; gap: 12px; overflow-y: auto; z-index: 10;
    }
    h1 { font-size: 1.15rem; margin: 0; color: #ff6b6b; display: flex; align-items: center; gap: 8px; }
    .section-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: #888899; border-bottom: 1px solid #2e2e3a; padding-bottom: 4px; margin-top: 4px;
    }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.84rem; color: #ccc; display: flex; justify-content: space-between; align-items: center; }
    input[type="text"], select {
      padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3a48;
      background: #262632; color: #fff; font-size: 0.92rem;
    }
    input[type="file"] { font-size: 0.8rem; color: #aaa; }
    input[type="file"]::file-selector-button {
      padding: 6px 10px; border-radius: 5px; border: 1px solid #4a4a5e;
      background: #323242; color: #fff; cursor: pointer; margin-right: 8px;
    }
    input[type="range"] { accent-color: #ff6b6b; cursor: pointer; }
    .style-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pill {
      padding: 7px 4px; text-align: center; background: #262632; border: 1px solid #3a3a48;
      border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: 0.15s;
    }
    .pill.active { background: #ff6b6b; border-color: #ff6b6b; color: #fff; font-weight: bold; }
    .color-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .letter-color-box {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: #262632; padding: 4px; border-radius: 6px; border: 1px solid #3a3a48;
    }
    .letter-color-box span { font-size: 0.72rem; font-weight: bold; }
    input[type="color"] { width: 26px; height: 22px; border: none; background: none; cursor: pointer; padding: 0; }
    .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding-top: 12px; }
    button {
      padding: 11px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.92rem;
      cursor: pointer; transition: 0.2s;
    }
    .btn-primary { background: #ff6b6b; color: #fff; }
    .btn-primary:hover { background: #ff5252; }
    .btn-secondary { background: #323242; color: #fff; border: 1px solid #4a4a5e; }
    .btn-secondary:hover { background: #3f3f52; }
    #canvas-container { flex: 1; position: relative; }
    .view-bar {
      position: absolute; top: 16px; right: 16px; display: flex; gap: 6px;
      background: #1c1c24; padding: 5px; border-radius: 8px; border: 1px solid #2e2e3a;
    }
    .view-btn {
      padding: 6px 12px; font-size: 0.8rem; background: transparent; color: #ccc;
      border-radius: 5px; border: none; cursor: pointer;
    }
    .view-btn:hover { background: #2e2e3a; color: #fff; }
    .dimensions-badge {
      position: absolute; bottom: 16px; left: 16px; font-size: 0.8rem;
      color: #ccc; background: rgba(28,28,36,0.9); padding: 7px 12px;
      border-radius: 6px; border: 1px solid #2e2e3a;
    }
    .hint {
      position: absolute; bottom: 16px; right: 16px; font-size: 0.8rem;
      color: #888; background: rgba(18,18,22,0.85); padding: 6px 12px; border-radius: 6px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

<div id="sidebar">
  <h1>🎈 Muse Made — Balloon Factory</h1>

  <div class="section-title">1. Tekst & Stijl</div>
  <div class="control-group">
    <label>Tekst / Naam</label>
    <input type="text" id="textInput" value="LOVE" maxlength="16" />
  </div>

  <div class="control-group">
    <label>Eigen lettertype (.ttf / .otf)</label>
    <input type="file" id="fontUpload" accept=".ttf,.otf" />
  </div>

  <div class="control-group">
    <label>Ballonstijl</label>
    <div class="style-pills" id="styleSelector">
      <div class="pill" data-style="ceramic">Ceramic</div>
      <div class="pill" data-style="bubble">Bubble</div>
      <div class="pill active" data-style="puffy">Puffy</div>
      <div class="pill" data-style="foil">Foil</div>
    </div>
  </div>

  <div class="control-group">
    <label>Oppervlakte-patroon (3D reliëf)</label>
    <select id="patternInput">
      <option value="smooth">Glad (Standaard)</option>
      <option value="stars">Sterretjes / Stippen</option>
      <option value="hearts">Hartjes-reliëf</option>
      <option value="knit">Gebreid / Ruitpatroon</option>
    </select>
  </div>

  <div class="control-group">
    <label>Kleuren per letter</label>
    <div class="color-row" id="letterColors"></div>
  </div>

  <div class="section-title">2. Afmetingen & Hoogte-bolling</div>
  <div class="control-group">
    <label>Hoogte letters (mm) <span id="sizeVal">80</span></label>
    <input type="range" id="sizeInput" min="20" max="150" step="2" value="80" />
  </div>

  <div class="control-group">
    <label>Basisdikte (mm) <span id="heightVal">14</span></label>
    <input type="range" id="heightInput" min="4" max="30" step="1" value="14" />
  </div>

  <div class="control-group">
    <label>Rand-afronding (zijbolling) <span id="inflateVal">6.5</span></label>
    <input type="range" id="inflateInput" min="1" max="12" step="0.5" value="6.5" />
  </div>

  <div class="control-group">
    <label>Kussen-bolling omhoog (Z-bolling) <span id="domeVal">8.0</span></label>
    <input type="range" id="domeInput" min="0" max="20" step="0.5" value="8.0" />
  </div>

  <div class="control-group">
    <label>Letter-afstand <span id="spacingVal">4</span></label>
    <input type="range" id="spacingInput" min="-12" max="20" step="0.5" value="4" />
  </div>

  <div class="section-title">3. Bevestiging (Vlakke achterkant)</div>
  <div class="control-group">
    <label>Type bevestiging</label>
    <select id="mountInput">
      <option value="none">Geen (alleen vlakke achterkant)</option>
      <option value="keychain">Sleutelhanger-oogje (links)</option>
      <option value="hanging">2 Ophang-oogjes (bovenop voor slinger)</option>
      <option value="magnet">Magneet-houder (10x2mm achterkant)</option>
      <option value="keyhole">Schroefgat / Keyhole (muurmontage)</option>
    </select>
  </div>

  <div class="btn-group">
    <button class="btn-primary" id="exportAllBtn">⬇️ Download Volledig STL (1 bestand)</button>
    <button class="btn-secondary" id="exportSeparateBtn">📦 Download Losse Letters (per STL)</button>
  </div>
</div>

<div id="canvas-container">
  <div class="view-bar">
    <button class="view-btn" id="viewFront">Front</button>
    <button class="view-btn" id="viewIso">Iso</button>
    <button class="view-btn" id="viewTop">Top</button>
  </div>
  <div class="dimensions-badge" id="dimBadge">Afmetingen: 0 × 0 × 0 mm | Geen supports</div>
  <div class="hint">Linkermuisknop: draaien | Scroll: zoomen | Rechtermuisknop: verplaatsen</div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { FontLoader } from 'three/addons/loaders/FontLoader.js';
  import { Font } from 'three/addons/loaders/FontLoader.js';
  import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
  import { STLExporter } from 'three/addons/exporters/STLExporter.js';

  // Scene & Renderer
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x121216);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 3000);
  camera.position.set(0, -180, 190);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Verlichting
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.7);
  dirLight1.position.set(100, -100, 180);
  scene.add(dirLight1);
  const dirLight2 = new THREE.DirectionalLight(0xaaccff, 0.7);
  dirLight2.position.set(-120, 120, 80);
  scene.add(dirLight2);

  // Printbed raster (Z = 0)
  const grid = new THREE.GridHelper(400, 40, 0x444455, 0x22222c);
  grid.rotation.x = Math.PI / 2;
  scene.add(grid);

  const modelGroup = new THREE.Group();
  scene.add(modelGroup);

  const defaultPalette = ['#c87d8a', '#b8a99a', '#6d8a7e', '#6593b5', '#d4a373', '#9b5de5', '#f15bb5'];
  let letterColors = [];
  let currentStyle = 'puffy';
  let loadedFont = null;

  // Camera snelknoppen
  document.getElementById('viewFront').addEventListener('click', () => {
    camera.position.set(0, -240, 40);
    controls.target.set(0, 0, 10);
  });
  document.getElementById('viewIso').addEventListener('click', () => {
    camera.position.set(0, -180, 190);
    controls.target.set(0, 0, 0);
  });
  document.getElementById('viewTop').addEventListener('click', () => {
    camera.position.set(0, -1, 260);
    controls.target.set(0, 0, 0);
  });

  // Standaard lettertype laden
  const loader = new FontLoader();
  loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
    loadedFont = font;
    syncColorPickers();
    updateModel();
  });

  // Eigen .ttf / .otf lettertype uploaden
  document.getElementById('fontUpload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const otFont = opentype.parse(event.target.result);
        const typefaceData = convertOpenTypeToThreeFont(otFont);
        loadedFont = new Font(typefaceData);
        updateModel();
      } catch (err) {
        alert('Kon dit lettertype niet inladen. Kies een geldig .ttf- of .otf-bestand.');
      }
    };
    reader.readAsArrayBuffer(file);
  });

  function convertOpenTypeToThreeFont(font) {
    const scale = (1000 * 100) / ((font.unitsPerEm || 2048) * 72);
    const result = {
      glyphs: {},
      familyName: font.names.fontFamily?.en || 'CustomFont',
      ascender: Math.round(font.ascender * scale),
      descender: Math.round(font.descender * scale),
      underlinePosition: Math.round((font.tables.post?.underlinePosition || -100) * scale),
      underlineThickness: Math.round((font.tables.post?.underlineThickness || 50) * scale),
      boundingBox: {
        yMin: Math.round((font.tables.head?.yMin || -200) * scale),
        xMin: Math.round((font.tables.head?.xMin || 0) * scale),
        yMax: Math.round((font.tables.head?.yMax || 800) * scale),
        xMax: Math.round((font.tables.head?.xMax || 1000) * scale)
      },
      resolution: 1000,
      original_font_information: font.tables.name
    };

    for (let i = 0; i < font.glyphs.length; i++) {
      const glyph = font.glyphs.get(i);
      if (glyph.unicode !== undefined) {
        const token = {
          ha: Math.round(glyph.advanceWidth * scale),
          x_min: Math.round((glyph.xMin || 0) * scale),
          x_max: Math.round((glyph.xMax || 0) * scale),
          o: ''
        };
        glyph.path.commands.forEach((cmd) => {
          const type = cmd.type.toLowerCase();
          if (type === 'm' || type === 'l') {
            token.o += `${type} ${Math.round(cmd.x * scale)} ${Math.round(cmd.y * scale)} `;
          } else if (type === 'q') {
            token.o += `q ${Math.round(cmd.x * scale)} ${Math.round(cmd.y * scale)} ${Math.round(cmd.x1 * scale)} ${Math.round(cmd.y1 * scale)} `;
          } else if (type === 'c') {
            token.o += `b ${Math.round(cmd.x * scale)} ${Math.round(cmd.y * scale)} ${Math.round(cmd.x1 * scale)} ${Math.round(cmd.y1 * scale)} ${Math.round(cmd.x2 * scale)} ${Math.round(cmd.y2 * scale)} `;
          }
        });
        result.glyphs[String.fromCharCode(glyph.unicode)] = token;
      }
    }
    return result;
  }

  // Stijl-knoppen (Ceramic, Bubble, Puffy, Foil)
  document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      currentStyle = pill.dataset.style;
      updateModel();
    });
  });

  // Kleurenkiezers per letter
  function syncColorPickers() {
    const text = document.getElementById('textInput').value;
    const container = document.getElementById('letterColors');
    container.innerHTML = '';

    [...text].forEach((char, idx) => {
      if (char === ' ') return;
      if (!letterColors[idx]) {
        letterColors[idx] = defaultPalette[idx % defaultPalette.length];
      }
      const box = document.createElement('div');
      box.className = 'letter-color-box';
      box.innerHTML = `<span>${char}</span>`;
      const input = document.createElement('input');
      input.type = 'color';
      input.value = letterColors[idx];
      input.addEventListener('input', (e) => {
        letterColors[idx] = e.target.value;
        updateModel();
      });
      box.appendChild(input);
      container.appendChild(box);
    });
  }

  // Verdeelt grote platte driehoeken in kleinere zodat het midden echt bol omhoog kan komen
  function subdivideGeometry(geometry, maxEdgeLength) {
    let geo = geometry.index ? geometry.toNonIndexed() : geometry;
    for (let pass = 0; pass < 3; pass++) {
      const pos = geo.attributes.position;
      const newPositions = [];
      let splitCount = 0;

      for (let i = 0; i < pos.count; i += 3) {
        const a = new THREE.Vector3().fromBufferAttribute(pos, i);
        const b = new THREE.Vector3().fromBufferAttribute(pos, i + 1);
        const c = new THREE.Vector3().fromBufferAttribute(pos, i + 2);

        const ab = a.distanceTo(b);
        const bc = b.distanceTo(c);
        const ca = c.distanceTo(a);
        const maxLen = Math.max(ab, bc, ca);

        if (maxLen > maxEdgeLength) {
          splitCount++;
          if (ab === maxLen) {
            const m = a.clone().add(b).multiplyScalar(0.5);
            newPositions.push(a.x, a.y, a.z, m.x, m.y, m.z, c.x, c.y, c.z);
            newPositions.push(m.x, m.y, m.z, b.x, b.y, b.z, c.x, c.y, c.z);
          } else if (bc === maxLen) {
            const m = b.clone().add(c).multiplyScalar(0.5);
            newPositions.push(b.x, b.y, b.z, m.x, m.y, m.z, a.x, a.y, a.z);
            newPositions.push(m.x, m.y, m.z, c.x, c.y, c.z, a.x, a.y, a.z);
          } else {
            const m = c.clone().add(a).multiplyScalar(0.5);
            newPositions.push(c.x, c.y, c.z, m.x, m.y, m.z, b.x, b.y, b.z);
            newPositions.push(m.x, m.y, m.z, a.x, a.y, a.z, b.x, b.y, b.z);
          }
        } else {
          newPositions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
        }
      }
      geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(newPositions, 3));
      if (splitCount === 0) break;
    }
    return geo;
  }

  // Blaast de letter op in zowel de breedte als in de hoogte (Z-as kussen-effect)
  function processBalloonGeometry(rawGeo, style, inflate, domeHeight, pattern, letterSize) {
    const maxEdge = Math.max(2.5, letterSize * 0.055);
    const geometry = subdivideGeometry(rawGeo, maxEdge);

    const pos = geometry.attributes.position;
    geometry.computeBoundingBox();
    const minZ = geometry.boundingBox.min.z;
    const maxZ = geometry.boundingBox.max.z;
    const midZ = (minZ + maxZ) / 2;

    const edgePoints = [];
    for (let i = 0; i < pos.count; i++) {
      const z = pos.getZ(i);
      if (Math.abs(z - midZ) < (maxZ - minZ) * 0.25) {
        edgePoints.push({ x: pos.getX(i), y: pos.getY(i) });
      }
    }

    const maxRadius = Math.max(4, letterSize * 0.16);

    for (let i = 0; i < pos.count; i++) {
      let x = pos.getX(i);
      let y = pos.getY(i);
      let z = pos.getZ(i);

      if (z <= midZ) {
        z = 0;
      } else {
        z = z - midZ;

        if (domeHeight > 0 && edgePoints.length > 0) {
          let minDistSq = Infinity;
          for (let j = 0; j < edgePoints.length; j += 2) {
            const dx = x - edgePoints[j].x;
            const dy = y - edgePoints[j].y;
            const dSq = dx * dx + dy * dy;
            if (dSq < minDistSq) minDistSq = dSq;
          }
          const dist = Math.sqrt(minDistSq);
          const normalizedDist = Math.min(1, dist / maxRadius);
          const domeOffset = Math.sin(normalizedDist * (Math.PI / 2)) * domeHeight;
          z += domeOffset;
        }

        if (style === 'foil') {
          const wrinkle = Math.sin(x * 0.4) * Math.cos(y * 0.4) * (inflate * 0.14);
          z = Math.max(0.2, z + wrinkle);
        }

        if (z > 2.0 && pattern !== 'smooth') {
          if (pattern === 'stars') {
            const wave = Math.sin(x * 0.85) * Math.sin(y * 0.85);
            if (wave > 0.65) z += 0.6;
          } else if (pattern === 'hearts') {
            const hx = (x % 9) - 4.5;
            const hy = (y % 9) - 4.5;
            const heartEq = Math.pow(hx * 0.22, 2) + Math.pow(hy * 0.22 - Math.sqrt(Math.abs(hx * 0.22)), 2);
            if (heartEq < 0.6) z += 0.55;
          } else if (pattern === 'knit') {
            const knit = Math.sin((x + y) * 1.0) * Math.cos((x - y) * 1.0);
            z += knit * 0.4;
          }
        }
      }
      pos.setXYZ(i, x, y, z);
    }

    geometry.computeVertexNormals();
    return geometry;
  }

  function createLoop(outerR, innerR, thickness) {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, outerR, 0, Math.PI * 2, false);
    const hole = new THREE.Path();
    hole.absarc(0, 0, innerR, 0, Math.PI * 2, true);
    shape.holes.push(hole);

    return new THREE.ExtrudeGeometry(shape, {
      depth: thickness,
      bevelEnabled: true,
      bevelSegments: 5,
      steps: 1,
      bevelSize: 0.7,
      bevelThickness: 0.7
    });
  }

  function updateModel() {
    if (!loadedFont) return;

    while (modelGroup.children.length > 0) {
      modelGroup.remove(modelGroup.children[0]);
    }

    const text = document.getElementById('textInput').value || ' ';
    const size = parseFloat(document.getElementById('sizeInput').value);
    const totalHeight = parseFloat(document.getElementById('heightInput').value);
    const inflate = parseFloat(document.getElementById('inflateInput').value);
    const domeHeight = parseFloat(document.getElementById('domeInput').value);
    const spacing = parseFloat(document.getElementById('spacingInput').value);
    const mountType = document.getElementById('mountInput').value;
    const pattern = document.getElementById('patternInput').value;

    document.getElementById('sizeVal').textContent = size;
    document.getElementById('heightVal').textContent = totalHeight;
    document.getElementById('inflateVal').textContent = inflate;
    document.getElementById('domeVal').textContent = domeHeight;
    document.getElementById('spacingVal').textContent = spacing;

    let bevelSize = inflate;
    let bevelThickness = totalHeight * 0.75;
    let bevelSegments = 16;
    let roughness = 0.35;
    let metalness = 0.05;
    let effectiveDome = domeHeight;

    if (currentStyle === 'ceramic') {
      bevelSize = inflate * 0.65;
      bevelThickness = totalHeight * 0.5;
      effectiveDome = domeHeight * 0.35;
      roughness = 0.15;
    } else if (currentStyle === 'bubble') {
      bevelSize = inflate;
      bevelThickness = totalHeight * 0.75;
      effectiveDome = domeHeight * 0.85;
      roughness = 0.25;
    } else if (currentStyle === 'puffy') {
      bevelSize = inflate * 1.35;
      bevelThickness = totalHeight * 0.9;
      bevelSegments = 20;
      effectiveDome = domeHeight * 1.25;
      roughness = 0.55;
    } else if (currentStyle === 'foil') {
      bevelSize = inflate * 1.1;
      bevelThickness = totalHeight * 0.75;
      effectiveDome = domeHeight * 1.0;
      roughness = 0.12;
      metalness = 0.65;
    }

    let currentX = 0;
    const chars = [...text];

    chars.forEach((char, idx) => {
      if (char === ' ') {
        currentX += size * 0.35;
        return;
      }

      const rawGeo = new TextGeometry(char, {
        font: loadedFont,
        size: size,
        height: totalHeight,
        curveSegments: 16,
        bevelEnabled: true,
        bevelThickness: bevelThickness,
        bevelSize: bevelSize,
        bevelOffset: 0,
        bevelSegments: bevelSegments
      });

      const balloonGeo = processBalloonGeometry(rawGeo, currentStyle, inflate, effectiveDome, pattern, size);
      balloonGeo.computeBoundingBox();
      const charWidth = balloonGeo.boundingBox.max.x - balloonGeo.boundingBox.min.x;

      const mat = new THREE.MeshStandardMaterial({
        color: letterColors[idx] || '#c87d8a',
        roughness: roughness,
        metalness: metalness
      });

      const letterGroup = new THREE.Group();
      letterGroup.name = `letter_${idx}_${char}`;

      const mesh = new THREE.Mesh(balloonGeo, mat);
      mesh.position.x = -balloonGeo.boundingBox.min.x;
      mesh.position.y = -balloonGeo.boundingBox.min.y;
      letterGroup.add(mesh);

      if (mountType === 'hanging') {
        const loop = createLoop(4.5, 2.2, Math.min(4, totalHeight * 0.4));
        const loopMesh = new THREE.Mesh(loop, mat);
        loopMesh.position.set(charWidth / 2, balloonGeo.boundingBox.max.y - balloonGeo.boundingBox.min.y + 1.5, 0.7);
        letterGroup.add(loopMesh);
      }

      if (mountType === 'magnet' || mountType === 'keyhole') {
        const outer = mountType === 'magnet' ? 7 : 5.5;
        const inner = mountType === 'magnet' ? 5.1 : 2.5;
        const mountRing = createLoop(outer, inner, 2.4);
        const mountMesh = new THREE.Mesh(mountRing, mat);
        mountMesh.position.set(charWidth / 2, (balloonGeo.boundingBox.max.y - balloonGeo.boundingBox.min.y) / 2, 0.7);
        letterGroup.add(mountMesh);
      }

      letterGroup.position.x = currentX;
      modelGroup.add(letterGroup);

      currentX += charWidth + spacing;
    });

    const box = new THREE.Box3().setFromObject(modelGroup);
    if (mountType === 'keychain' && text.trim().length > 0) {
      const firstMat = new THREE.MeshStandardMaterial({
        color: letterColors[0] || '#c87d8a',
        roughness: roughness,
        metalness: metalness
      });
      const ringGeo = createLoop(5.5, 2.8, Math.min(5, totalHeight * 0.5));
      const ringMesh = new THREE.Mesh(ringGeo, firstMat);
      ringMesh.position.set(box.min.x - 3, (box.max.y + box.min.y) / 2, 0.7);
      modelGroup.add(ringMesh);
    }

    const finalBox = new THREE.Box3().setFromObject(modelGroup);
    modelGroup.position.x = -(finalBox.max.x + finalBox.min.x) / 2;
    modelGroup.position.y = -(finalBox.max.y + finalBox.min.y) / 2;
    modelGroup.position.z = 0;

    const w = Math.round(finalBox.max.x - finalBox.min.x);
    const h = Math.round(finalBox.max.y - finalBox.min.y);
    const d = Math.round(finalBox.max.z - finalBox.min.z);
    document.getElementById('dimBadge').textContent = `Afmetingen: ${w} × ${h} × ${d} mm | Geen supports`;
  }

  document.getElementById('textInput').addEventListener('input', () => {
    syncColorPickers();
    updateModel();
  });

  ['sizeInput', 'heightInput', 'inflateInput', 'domeInput', 'spacingInput', 'mountInput', 'patternInput'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateModel);
  });

  function downloadSTL(object3D, filename) {
    const exporter = new STLExporter();
    const stlData = exporter.parse(object3D, { binary: true });
    const blob = new Blob([stlData], { type: 'application/octet-stream' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

  document.getElementById('exportAllBtn').addEventListener('click', () => {
    const baseName = (document.getElementById('textInput').value || 'balloon').toLowerCase().replace(/[^a-z0-9]/g, '_');
    downloadSTL(modelGroup, `${baseName}_${currentStyle}.stl`);
  });

  document.getElementById('exportSeparateBtn').addEventListener('click', () => {
    const baseName = (document.getElementById('textInput').value || 'balloon').toLowerCase().replace(/[^a-z0-9]/g, '_');
    let count = 0;
    modelGroup.children.forEach((child) => {
      if (child.name.startsWith('letter_')) {
        count++;
        const char = child.name.split('_')[2];
        downloadSTL(child, `${baseName}_${count}_${char}.stl`);
      }
    });
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
